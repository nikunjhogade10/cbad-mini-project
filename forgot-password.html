<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Forgot Password — Containerized Student Management System"/>
  <title>Forgot Password — Student Management System</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/design-system.css"/>
  <link rel="stylesheet" href="assets/css/components.css"/>
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-base);
      padding: var(--space-8) var(--space-4);
    }
    .auth-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-2xl);
      padding: var(--space-8);
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
    }
    .auth-card-header { text-align: center; margin-bottom: var(--space-6); }
    .auth-logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--primary-600), var(--secondary-600));
      border-radius: var(--radius-2xl);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-4);
      box-shadow: 0 4px 12px rgba(37,99,235,0.3);
    }
    .auth-card-title { font-size: var(--text-2xl); font-weight: var(--fw-bold); color: var(--text-primary); margin-bottom: var(--space-2); }
    .auth-card-sub { font-size: var(--text-sm); color: var(--text-secondary); line-height: var(--lh-relaxed); }
    .auth-form { display: flex; flex-direction: column; gap: var(--space-4); }
    .auth-back {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--text-sm);
      color: var(--text-secondary);
      text-decoration: none;
      margin-top: var(--space-4);
      justify-content: center;
    }
    .auth-back:hover { color: var(--primary-600); text-decoration: none; }
    .success-state { display: none; text-align: center; }
    .success-state.show { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); }
    .success-icon {
      width: 64px; height: 64px;
      background: var(--success-50);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--success-600);
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="auth-logo">
          <svg width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/></svg>
        </div>
        <h1 class="auth-card-title">Forgot Password</h1>
        <p class="auth-card-sub">Enter your registered Student ID or email address. We'll send you a link to reset your password.</p>
      </div>

      <!-- Form state -->
      <div id="formState">
        <form class="auth-form" onsubmit="handleForgot(event)">
          <div class="form-group">
            <label class="form-label" for="forgotId">Student ID or Email <span class="required">*</span></label>
            <input type="text" id="forgotId" class="form-control" placeholder="e.g. MIT2026CS101 or nikunj@mit.edu.in" required/>
          </div>
          <button type="submit" class="btn btn-primary btn-xl btn-block" id="forgotBtn">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            Send Reset Link
          </button>
        </form>
      </div>

      <!-- Success state -->
      <div id="successState" class="success-state">
        <div class="success-icon">
          <svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <div>
          <div style="font-size: var(--text-lg); font-weight: var(--fw-semibold); margin-bottom: var(--space-2);">Check your inbox</div>
          <p class="auth-card-sub">A password reset link has been sent to your registered email address. The link will expire in 30 minutes.</p>
        </div>
        <a href="index.html" class="btn btn-secondary btn-block">Back to Login</a>
      </div>

      <a href="index.html" class="auth-back" id="backLink">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Back to login
      </a>
    </div>
  </div>

  <div class="toast-container"></div>
  <script src="assets/js/app.js"></script>
  <script>
    function handleForgot(e) {
      e.preventDefault();
      const btn = document.getElementById('forgotBtn');
      btn.classList.add('loading'); btn.disabled = true;
      setTimeout(() => {
        document.getElementById('formState').style.display = 'none';
        document.getElementById('backLink').style.display = 'none';
        document.getElementById('successState').classList.add('show');
      }, 1500);
    }
  </script>
</body>
</html>
