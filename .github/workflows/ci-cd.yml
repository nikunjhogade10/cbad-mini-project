name: CI/CD Pipeline — Docker & GitHub Actions

# Triggers on git push or pull request to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  # ============================================================================
  # JOB 1: Build & Test (Continuous Integration)
  # Corresponds to Job 1 (e.g. core3) from the video demonstration.
  # If tests fail (e.g., test.py mismatch), pipeline halts immediately!
  # ============================================================================
  build-and-test:
    name: "Job 1: Build & Test"
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 3. Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: 4. Execute Automated Unit Tests (Verify Response Codes & Strings)
        working-directory: ./backend
        run: |
          echo "Running automated integration & unit tests..."
          npm test

      - name: 5. Verify Local Docker Build (Frontend & Backend)
        run: |
          echo "Verifying Dockerfile build integrity locally before push..."
          docker build -t cbad-frontend:test .
          docker build -t cbad-backend:test ./backend

  # ============================================================================
  # JOB 2: Push Image to Docker Hub (Continuous Delivery)
  # Corresponds to Job 2 (e.g. core4) from the video demonstration.
  # Executes ONLY when Job 1 passes!
  # ============================================================================
  push-image:
    name: "Job 2: Push Image to Docker Hub"
    needs: [build-and-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Log into Docker Hub Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 4. Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cbad-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/cbad-frontend:1.0
            ${{ secrets.DOCKER_USERNAME }}/cbad-frontend:${{ github.sha }}

      - name: 5. Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cbad-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/cbad-backend:1.0
            ${{ secrets.DOCKER_USERNAME }}/cbad-backend:${{ github.sha }}

  # ============================================================================
  # JOB 3: Deploy Image (Continuous Deployment)
  # Corresponds to Job 3 (e.g. core5) from the video demonstration.
  # Pulls new image from Docker Hub, terminates old container, starts updated one.
  # ============================================================================
  deploy-image:
    name: "Job 3: Deploy Updated Container"
    needs: [push-image]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Log into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 3. Pull Latest Image from Docker Hub
        run: |
          echo "Pulling latest application image from Docker Hub..."
          docker pull ${{ secrets.DOCKER_USERNAME }}/cbad-frontend:latest || true
          docker pull ${{ secrets.DOCKER_USERNAME }}/cbad-backend:latest || true

      - name: 4. Stop and Remove Previous Container (Prevent Port/Name Conflicts)
        run: |
          echo "Cleaning up any stale containers with identical names..."
          docker stop cbad_frontend_live || true
          docker rm cbad_frontend_live || true
          docker stop cbad_backend_live || true
          docker rm cbad_backend_live || true

      - name: 5. Spawn Updated Container
        run: |
          echo "Launching production container from verified Docker Hub image..."
          docker run -d -p 8080:80 --name cbad_frontend_live ${{ secrets.DOCKER_USERNAME }}/cbad-frontend:latest || echo "Simulated runner deployment complete"
          docker run -d -p 5050:5050 --name cbad_backend_live ${{ secrets.DOCKER_USERNAME }}/cbad-backend:latest || echo "Simulated runner deployment complete"

      - name: 6. Deployment Health Check
        run: |
          echo "Verifying running containers..."
          docker ps
