version: '3.8'

services:
  # 1. Frontend Web Application (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cbad_frontend
    ports:
      - "8080:80"
    restart: always
    depends_on:
      - backend

  # 2. Backend REST API Service (Node.js / Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cbad_backend
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=cbad_user
      - DB_PASSWORD=cbad_password_2026
      - DB_NAME=cbad_db
    restart: always
    depends_on:
      db:
        condition: service_healthy

  # 3. MySQL Database Service (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: cbad_mysql
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=cbad_db
      - MYSQL_USER=cbad_user
      - MYSQL_PASSWORD=cbad_password_2026
      - MYSQL_ROOT_PASSWORD=cbad_root_secret
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pcbad_root_secret || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  mysql_data:
    driver: local
