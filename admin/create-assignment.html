<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Assignment — Admin Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../assets/css/design-system.css"/>
  <link rel="stylesheet" href="../assets/css/components.css"/>
  <link rel="stylesheet" href="../assets/css/sidebar.css"/>
</head>
<body>
<div class="app-layout">
  <div id="sidebarContainer"></div>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle"><svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <nav class="breadcrumb"><span class="breadcrumb-item"><a href="assignments.html">Assignments</a></span><span class="breadcrumb-sep">/</span><span class="breadcrumb-item">Create Assignment</span></nav>
      </div>
      <div class="topbar-right">
        <a href="assignments.html" class="btn btn-secondary btn-sm">← All Assignments</a>
      </div>
    </header>

    <main class="page-body" style="max-width:860px;">
      <div class="page-header">
        <div class="page-header-left">
          <h1 class="page-title">Create Assignment</h1>
          <p class="label-text">Add a new assignment for students</p>
        </div>
      </div>

      <form onsubmit="handleCreate(event)">
        <!-- Basic Info -->
        <div class="card mb-4">
          <div class="card-header"><div class="card-title">Assignment Details</div></div>
          <div class="card-body">
            <div class="form-row" style="grid-template-columns:1fr 1fr;">
              <div class="form-group">
                <label class="form-label">Assignment Title <span class="required">*</span></label>
                <input class="form-control" placeholder="e.g. CBAD Practical 1" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Subject <span class="required">*</span></label>
                <select class="form-control" required>
                  <option value="">Select Subject</option>
                  <option>CBAD</option>
                  <option>PE-I</option>
                  <option>DAA</option>
                  <option>CNEL Network Engineering Lab (CNEL)</option>
                  <option>CNEL Application Programming Models Lab (CAPCAPML)</option>
                  <option>Container Based Application Development Lab (CBADL)</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Unit / Topic</label>
                <input class="form-control" placeholder="e.g. Unit 2 — CBAD Networking"/>
              </div>
              <div class="form-group">
                <label class="form-label">Assigned To <span class="required">*</span></label>
                <select class="form-control" required>
                  <option>All Divisions (A, B, C)</option>
                  <option>Division A Only</option>
                  <option>Division B Only</option>
                  <option>Division C Only</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Assigned Date <span class="required">*</span></label>
                <input class="form-control" type="date" value="2026-09-01" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Due Date &amp; Time <span class="required">*</span></label>
                <input class="form-control" type="datetime-local" value="2026-09-15T23:59" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Max Marks <span class="required">*</span></label>
                <input class="form-control" type="number" min="1" max="100" value="10" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Allow Late Submission</label>
                <select class="form-control">
                  <option>No</option>
                  <option>Yes – with penalty</option>
                  <option>Yes – no penalty</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Description -->
        <div class="card mb-4">
          <div class="card-header"><div class="card-title">Assignment Description</div></div>
          <div class="card-body">
            <div class="form-group">
              <label class="form-label">Description <span class="required">*</span></label>
              <textarea class="form-control" rows="5" placeholder="Detailed description of the assignment, objectives, and expected outcomes..." required></textarea>
            </div>
            <div class="form-group" style="margin-top:var(--space-4);">
              <label class="form-label">Instructions &amp; Requirements</label>
              <textarea class="form-control" rows="4" placeholder="1. Requirement 1&#10;2. Requirement 2&#10;3. Requirement 3"></textarea>
            </div>
          </div>
        </div>

        <!-- Attachments -->
        <div class="card mb-4">
          <div class="card-header"><div class="card-title">Attachments &amp; Resources</div></div>
          <div class="card-body">
            <div class="form-group">
              <label class="form-label">Reference Documents</label>
              <div style="border: 2px dashed var(--border-default); border-radius: var(--radius-xl); padding: var(--space-8); text-align: center; cursor: pointer; transition: all var(--transition-base);" onmouseenter="this.style.borderColor='var(--primary-400)';this.style.background='var(--primary-50)';" onmouseleave="this.style.borderColor='';this.style.background='';" onclick="document.getElementById('fileInput').click()">
                <svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="var(--text-tertiary)" stroke-width="1.5" style="margin:0 auto var(--space-2);display:block;"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                <div style="font-size:var(--text-sm);font-weight:var(--fw-medium);margin-bottom:4px;">Click to upload or drag &amp; drop</div>
                <div style="font-size:var(--text-xs);color:var(--text-tertiary);">PDF, DOCX, ZIP, images (Max 50MB)</div>
                <input type="file" id="fileInput" multiple style="display:none;" onchange="showFile(this)"/>
              </div>
              <div id="fileList" style="margin-top:var(--space-3);display:flex;flex-direction:column;gap:var(--space-2);"></div>
            </div>
          </div>
        </div>

        <!-- Submission Type -->
        <div class="card mb-6">
          <div class="card-header"><div class="card-title">Submission Settings</div></div>
          <div class="card-body">
            <div class="form-row" style="grid-template-columns:1fr 1fr;">
              <div class="form-group">
                <label class="form-label">Submission Type</label>
                <select class="form-control">
                  <option>File Upload (PDF, DOCX, ZIP)</option>
                  <option>Text Submission</option>
                  <option>URL / Link</option>
                  <option>Multiple Files</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Max File Size</label>
                <select class="form-control">
                  <option>5 MB</option><option selected>10 MB</option><option>25 MB</option><option>50 MB</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div style="display:flex;justify-content:flex-end;gap:var(--space-3);">
          <a href="assignments.html" class="btn btn-secondary">Cancel</a>
          <button type="button" class="btn btn-ghost" onclick="showToast('info','Saved','Assignment saved as draft.')">Save as Draft</button>
          <button type="submit" class="btn btn-primary">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            Publish Assignment
          </button>
        </div>
      </form>
    </main>
  </div>
</div>
<div class="toast-container"></div>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/admin-sidebar.js"></script>
<script>
function handleCreate(e) {
  e.preventDefault();
  showToast('success', 'Assignment Created', 'Assignment has been published and students notified.');
  setTimeout(() => window.location.href = 'assignments.html', 1500);
}
function showFile(input) {
  const list = document.getElementById('fileList');
  Array.from(input.files).forEach(f => {
    const div = document.createElement('div');
    div.style.cssText = 'display:flex;align-items:center;gap:8px;background:var(--neutral-50);border:1px solid var(--border-default);border-radius:8px;padding:8px 12px;font-size:13px;';
    div.innerHTCAPML = `<svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg><span style="flex:1;">${f.name}</span><span style="color:var(--text-tertiary);font-size:11px;">${(f.size/1024).toFixed(1)}KB</span>`;
    list.appendChild(div);
  });
}
</script>
</body>
</html>
